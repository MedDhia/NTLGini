on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

name: test-coverage

permissions:
  contents: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::arrow, any::ggplot2, any::sf, any::terra, any::jsonlite
          needs: check
      - name: Compute coverage and generate Shields endpoint JSON
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          pct <- round(covr::percent_coverage(cov), 1)
          col <- if (pct >= 90) {
            "brightgreen"
          } else if (pct >= 75) {
            "green"
          } else if (pct >= 50) {
            "yellow"
          } else {
            "orange"
          }
          payload <- list(
            schemaVersion = 1L,
            label = "coverage",
            message = paste0(pct, "%"),
            color = col
          )
          dir.create(".github/badges", recursive = TRUE, showWarnings = FALSE)
          jsonlite::write_json(payload, ".github/badges/coverage.json", auto_unbox = TRUE)
          cat("Coverage:", pct, "%\n")
        shell: Rscript {0}
      - name: Commit and push updated coverage to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update coverage badge [skip ci]"
            git push origin main
          fi
